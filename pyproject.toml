[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "experiment-records"
version = "0.1.0"
description = "Content-addressed, reproducible experiment record and cache system"
requires-python = ">=3.11"

[project.scripts]
experiment-records = "exp_records.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
