[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "experiment-repro"
version = "0.1.0"
description = "Content-addressed, reproducible local experiment records"
requires-python = ">=3.9"

[project.scripts]
experiment-repro = "experiment_repro.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
